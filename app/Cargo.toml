[package]
name = "wattop-app"
version = "0.3.3"
edition = "2024"
publish = false

[dependencies]
wattop = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
