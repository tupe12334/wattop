[package]
name = "wattop"
version = "0.4.0"
edition = "2024"
description = "Hybrid-car style terminal power dashboard for macOS laptops: live watts, charger port and battery flow"
license = "MIT"
repository = "https://github.com/tupe12334/wattop"
readme = "README.md"
keywords = ["power", "battery", "macos", "tui", "dashboard"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["app/"]

# docs.rs builds on Linux by default; IOKit links only on Apple targets.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[workspace]
members = ["app"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
plist = "1.10.3"
ratatui = "0.30.2"
sysinfo = "0.40.1"
