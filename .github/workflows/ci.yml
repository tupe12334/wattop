name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Bundle the CLI as an app sidecar
        run: |
          cargo build --release -p wattop
          mkdir -p app/binaries
          cp target/release/wattop app/binaries/wattop-aarch64-apple-darwin
      - name: Clippy
        run: cargo clippy --workspace --release -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Publish dry run
        run: cargo publish --dry-run -p wattop

  linecheck:
    name: Line counts (linecheck)
    runs-on: ubuntu-latest
    env:
      LINECHECK_VERSION: v1.2.2
      LINECHECK_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Install linecheck (pinned release binary)
        run: |
          ARCHIVE="linecheck-$LINECHECK_VERSION-$LINECHECK_TARGET.tar.gz"
          BASE="https://github.com/tupe12334/linecheck/releases/download/$LINECHECK_VERSION/$ARCHIVE"
          curl -fsSLO "$BASE"
          curl -fsSLO "$BASE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
          tar xzf "$ARCHIVE"
          sudo install "linecheck-$LINECHECK_VERSION-$LINECHECK_TARGET/linecheck" /usr/local/bin/
      - name: Run linecheck
        run: linecheck .
