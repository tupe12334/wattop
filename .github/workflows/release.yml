name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-crate:
    name: Publish wattop to crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: macos-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Get crates.io token via trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish
        run: cargo publish -p wattop
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  app-bundle:
    name: Build unsigned macOS app
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Bundle the CLI as an app sidecar
        run: |
          cargo build --release -p wattop
          mkdir -p app/binaries
          cp target/release/wattop app/binaries/wattop-aarch64-apple-darwin
      - name: Build app (ad-hoc signed, not notarized)
        working-directory: app
        run: cargo tauri build --bundles app
      - name: Verify the app signature
        run: codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/Wattop.app
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install dmgbuild
      - name: Package and upload to GitHub release (unsigned)
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app)
          ditto -c -k --keepParent "$APP" "Wattop-$TAG-aarch64.app.zip"
          "$RUNNER_TEMP/dmgvenv/bin/dmgbuild" -s app/dmg/settings.py -D app="$APP" "Wattop" "Wattop-$TAG-aarch64.dmg"
          gh release upload "$TAG" "Wattop-$TAG-aarch64.app.zip" "Wattop-$TAG-aarch64.dmg" --clobber
